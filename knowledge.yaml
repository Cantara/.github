
entity:
  name: .github
  type: open-source-library
  description: >
    Cantara org-wide shared GitHub Actions workflows

authority:
  owner: Cantara — Norwegian Software Development Foundation
  repo: https://github.com/Cantara/.github
  license: Apache-2.0
  org_manifest: https://wiki.cantara.no/knowledge.yaml

discovery:
  provenance: canonical
  confidence: medium
  staleness_days: 30

signing:
  scheme: ed25519
  scope: this-manifest
  public_key: https://wiki.cantara.no/.well-known/kcp-signing-key.pub

kcp_version: "0.26"
project: .github
language: en
license: "Apache-2.0"
runtime: Java
indexing: open
updated: "2026-05-08"


units:

  - id: readme
    path: README.md
    intent: "What is .github, what does it do, and how do I install and use it?"
    scope: global
    audience: [human, agent, developer]
    validated: "2026-05-08"
    triggers: [overview, install, usage, .github, getting started]

# Serving Endpoint Binding (KCP SPEC v0.26 §3.12): authoritative manifest URL
# and authorized MCP representative. Ignored by pre-0.26 verifiers.
serving:
  manifest:
    - https://raw.githubusercontent.com/Cantara/.github/main/knowledge.yaml
  mcp:
    - https://mcp.cantara.no/mcp
